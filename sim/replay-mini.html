const cards=RUNS.map(r=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<h2>${r.label}<span class=st></span></h2><canvas class=rod data-h=170 style="height:170px"></canvas><canvas class=plot data-h=56 style="height:56px"></canvas><canvas class=arm data-h=50 style="height:50px"></canvas><pre class=con></pre>`;grid.append(c);
 return {r,c,rod:c.querySelector('.rod'),plot:c.querySelector('.plot'),arm:c.querySelector('.arm'),con:c.querySelector('.con'),st:c.querySelector('.st')}});
function fit(cv){const H=+cv.dataset.h,w=Math.round(cv.clientWidth*devicePixelRatio),h=Math.round(H*devicePixelRatio);if(cv.width!=w)cv.width=w;if(cv.height!=h)cv.height=h;const x=cv.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,w,h);x.scale(devicePixelRatio,devicePixelRatio);return [x,cv.clientWidth,H]}
function idx(d,t){let lo=0,hi=d.t.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(d.t[m]<=t)lo=m;else hi=m-1}return lo}
function drawRod(cc,i){const d=cc.r.d;const [x,w,h]=fit(cc.rod);const a=d.a[i]*Math.PI/180,th=d.arm[i]*Math.PI/180;
 const cx=w/2,cy=h*0.62,R=Math.min(w,h)*0.30,L=R*1.2,tilt=0.32;
 const P=(px,py,pz)=>[cx+px,cy-pz-py*tilt];
 // base and shaft
 x.strokeStyle=css('--line');x.lineWidth=2;x.beginPath();x.ellipse(cx,cy+R*0.3,R*1.05,R*1.05*tilt,0,0,7);x.stroke();
 x.strokeStyle=css('--mut');x.lineWidth=5;x.beginPath();x.moveTo(cx,cy+R*0.3);x.lineTo(cx,cy);x.stroke();
 const ex=R*Math.sin(th),ey=-R*Math.cos(th);
 const px=Math.cos(th),py=Math.sin(th);
 const tipx=ex+L*Math.sin(a)*px,tipy=ey+L*Math.sin(a)*py,tipz=L*Math.cos(a);
 const [ax,ay]=P(ex,ey,0),[bx,by]=P(tipx,tipy,tipz);
 x.strokeStyle=css('--arm');x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(cx,cy);x.lineTo(ax,ay);x.stroke();
 const upright=Math.abs(d.a[i])<26;
 x.strokeStyle=css('--rod');x.lineWidth=upright?6:4;x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke();
 x.fillStyle=css('--rod');x.beginPath();x.arc(bx,by,5,0,7);x.fill();
 x.fillStyle=css('--mut');x.font='12px system-ui';x.fillText(`rod ${d.a[i].toFixed(0)}° from up`,8,16);x.fillText(`arm ${(d.arm[i]/360).toFixed(2)} turns`,8,32);if(T>=KNOCK&&T<KNOCK+1.5){x.fillStyle='#c0271d';x.font='bold 14px system-ui';x.textAlign='right';x.fillText('KNOCK',w-8,24);x.textAlign='left';x.fillStyle=css('--mut');x.font='12px system-ui'}x.fillText(d.amps[i]?`drive ${d.amps[i].toFixed(2)} A`:'drive off',8,48);}
function drawPlot(cc,i){const d=cc.r.d;const [x,w,h]=fit(cc.plot);const X=t=>t/tmax*w,Y=a=>h/2-a/180*(h/2-2);
 x.fillStyle=css('--band');x.fillRect(0,Y(26),w,Y(-26)-Y(26));
 x.strokeStyle=css('--rod');x.lineWidth=1;x.beginPath();let pen=false,pa=0;for(let k=0;k<=i;k++){const a=d.a[k];if(pen&&Math.abs(a-pa)<180)x.lineTo(X(d.t[k]),Y(a));else x.moveTo(X(d.t[k]),Y(a));pen=true;pa=a}x.stroke();
 x.fillStyle=css('--mut');x.font='11px system-ui';x.fillText('rod angle from upright, ±180°',4,11);x.fillStyle='#c0271d';x.fillRect(X(KNOCK),0,2,h);}
function drawArm(cc,i){const d=cc.r.d;const [x,w,h]=fit(cc.arm);let m=90;for(const v of d.arm)m=Math.max(m,Math.abs(v));for(const v of d.cmd)m=Math.max(m,Math.abs(v));
 const X=t=>t/tmax*w,Y=a=>h/2-a/m*(h/2-2);
 const ln=(arr,col)=>{x.strokeStyle=col;x.lineWidth=1;x.beginPath();for(let k=0;k<=i;k++){k?x.lineTo(X(d.t[k]),Y(arr[k])):x.moveTo(X(d.t[k]),Y(arr[k]))}x.stroke()};
 ln(d.cmd,css('--line'));ln(d.arm,css('--arm'));x.fillStyle=css('--mut');x.font='11px system-ui';x.fillText(`arm vs commanded, full scale ${(m/360).toFixed(2)} turns`,4,11);}
function textTo(d,t){const lines=d.con.filter(c=>c[0]<=t).slice(-7).map(c=>c[1]);return lines.join('\n')}
let lastText=[];
function frame(ts){if(last!=null&&playing){T+=(ts-last)/1000*speed;if(T>tmax){T=0}}last=ts;
 document.getElementById('tr').value=T/tmax*1000;document.getElementById('time').textContent=T.toFixed(1)+' s';
 cards.forEach((cc,n)=>{const i=idx(cc.r.d,T);drawRod(cc,i);drawPlot(cc,i);drawArm(cc,i);const tx=textTo(cc.r.d,T);if(lastText[n]!==tx){cc.con.textContent=tx;lastText[n]=tx}cc.st.textContent=cc.r.note||''});
 requestAnimationFrame(frame)}
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play'};
document.getElementById('sp').onclick=e=>{speed={1:2,2:4,4:0.5,0.5:1}[speed];e.target.textContent=speed+'x'};
document.getElementById('tr').oninput=e=>{T=e.target.value/1000*tmax};
// the timeline's marks: when each model first stays within the upright band for a second, and the knock. Close labels stack, so they stay readable
(function(){const box=document.getElementById('marks'),THUMB=8;
 const at=f=>`calc(${THUMB}px + (100% - ${2*THUMB}px) * ${f})`;
 const ups=[];RUNS.forEach((r,n)=>{const d=r.d;let start=null;for(let k=0;k<d.t.length;k++){if(d.t[k]<6)continue;if(Math.abs(d.a[k])<26){if(start==null)start=d.t[k];if(d.t[k]-start>=1){ups.push({t:start,name:SHORT[n]});return}}else start=null}});
 ups.sort((a,b)=>a.t-b.t);
 const rows=[];const placed=ups.map(u=>{const px=u.t/tmax;let i=0;while(rows[i]!=null&&px-rows[i]<0.075)i++;rows[i]=px;return {...u,row:i}});
 const nrows=Math.max(1,rows.length),lh=12,top=20,height=top+nrows*lh+7;box.style.setProperty('--mh',height+'px');
 const jump=t=>{T=t};
 placed.forEach(u=>{const b=document.createElement('button');b.type='button';b.className='upm';b.textContent=u.name;b.title=`${u.name} comes up at ${u.t.toFixed(1)} s`;b.style.left=at(u.t/tmax);b.style.top=(top+u.row*lh)+'px';b.style.zIndex=u.row;b.style.setProperty('--stem',((nrows-1-u.row)*lh+4)+'px');b.onclick=()=>jump(u.t);box.append(b)});
 const k=document.createElement('button');k.type='button';k.className='knk';k.textContent=`KNOCK at ${KNOCK} s`;k.style.left=at(KNOCK/tmax);k.onclick=()=>jump(KNOCK-1);box.append(k);
 const l=document.createElement('div');l.className='knkline';l.style.left=at(KNOCK/tmax);box.append(l);})();
requestAnimationFrame(frame);
</script></body></html>
